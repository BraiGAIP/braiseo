name: Deploy BraiSEO (Cloudflare)

# Deploys BraiSEO with the upstream Cloudflare self-host flow
# (docs/SELF_HOSTING_CLOUDFLARE.md): `pnpm deploy:selfhost`, stage "selfhost",
# protected by Cloudflare Access. Runs on every push to main, or manually from
# the Actions tab.
#
# Repository secrets (Settings → Secrets and variables → Actions):
#   CLOUDFLARE_API_TOKEN   required – custom token, Account permissions:
#                          Workers Scripts, Workers KV Storage, D1, Workers R2
#                          Storage, Workflows, Access: Apps and Policies,
#                          Access: Organizations…, Secrets Store: Edit;
#                          Account Settings: Read
#   CLOUDFLARE_ACCOUNT_ID  required
#   DATAFORSEO_API_KEY     required – base64 of "email:api_password"
#                          (a plain "email:api_password" is accepted too). Or
#                          set DATAFORSEO_LOGIN + DATAFORSEO_PASSWORD instead.
#   ACCESS_ALLOWED_EMAILS  required – comma-separated emails allowed to sign in
#   OPENROUTER_API_KEY     optional – enables SAM, the in-app AI agent

on:
  push:
    branches: [main]
    paths-ignore:
      - "**/*.md"
      - docs/**
  workflow_dispatch:

concurrency:
  group: deploy-braiseo
  cancel-in-progress: false

permissions:
  contents: read

env:
  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
  CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

jobs:
  deploy:
    # Upstream mirrors of this fork must not try to deploy.
    if: github.repository == 'BraiGAIP/braiseo'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Check configuration
        env:
          ACCESS_ALLOWED_EMAILS: ${{ secrets.ACCESS_ALLOWED_EMAILS }}
          HAS_DFS_KEY: ${{ secrets.DATAFORSEO_API_KEY != '' }}
          HAS_DFS_LOGIN: ${{ secrets.DATAFORSEO_LOGIN != '' && secrets.DATAFORSEO_PASSWORD != '' }}
        run: |
          missing=""
          [ -n "$CLOUDFLARE_API_TOKEN" ] || missing="$missing CLOUDFLARE_API_TOKEN"
          [ -n "$CLOUDFLARE_ACCOUNT_ID" ] || missing="$missing CLOUDFLARE_ACCOUNT_ID"
          [ -n "$ACCESS_ALLOWED_EMAILS" ] || missing="$missing ACCESS_ALLOWED_EMAILS"
          [ "$HAS_DFS_KEY" = true ] || [ "$HAS_DFS_LOGIN" = true ] || missing="$missing DATAFORSEO_API_KEY"
          if [ -n "$missing" ]; then
            echo "::error::Missing repository secrets:$missing"
            exit 1
          fi

      # Normalizes the DataForSEO credentials to the base64 form the app expects
      # and verifies them against the API before spending minutes on the build.
      - name: Check DataForSEO credentials
        env:
          DATAFORSEO_API_KEY: ${{ secrets.DATAFORSEO_API_KEY }}
          DATAFORSEO_LOGIN: ${{ secrets.DATAFORSEO_LOGIN }}
          DATAFORSEO_PASSWORD: ${{ secrets.DATAFORSEO_PASSWORD }}
        shell: python
        run: |
          import base64, binascii, json, os, re, sys, urllib.error, urllib.request

          def clean(value):
              # Pasted secrets often carry spaces, newlines or U+2028/U+2029.
              return re.sub(r"[\s\u2028\u2029\ufeff]", "", value or "")

          def fail(message):
              print(f"::error::{message}")
              sys.exit(1)

          key = clean(os.environ.get("DATAFORSEO_API_KEY"))
          login = clean(os.environ.get("DATAFORSEO_LOGIN"))
          password = clean(os.environ.get("DATAFORSEO_PASSWORD"))
          if not key:
              key = base64.b64encode(f"{login}:{password}".encode()).decode()
          elif ":" in key:
              # "email:password" pasted as-is instead of its base64 form.
              key = base64.b64encode(key.encode()).decode()
          print(f"::add-mask::{key}")

          try:
              decoded = base64.b64decode(key + "=" * (-len(key) % 4), validate=True).decode()
          except (binascii.Error, UnicodeDecodeError):
              decoded = ""
          if ":" not in decoded:
              fail("DATAFORSEO_API_KEY is not base64 of 'email:api_password'. Copy the "
                   "'Base64' value from https://app.dataforseo.com/api-access, or save "
                   "'email:api_password' as the secret.")
          print(f"::add-mask::{decoded.split(':', 1)[1]}")

          request = urllib.request.Request(
              "https://api.dataforseo.com/v3/appendix/user_data",
              headers={"Authorization": f"Basic {key}"},
          )
          try:
              with urllib.request.urlopen(request, timeout=30) as response:
                  body = json.load(response)
          except urllib.error.HTTPError as exc:
              if exc.code == 401:
                  fail("DataForSEO rejected the credentials (HTTP 401). Use the API password "
                       "from https://app.dataforseo.com/api-access, not your login password.")
              fail(f"DataForSEO check failed: HTTP {exc.code}")
          except urllib.error.URLError as exc:
              fail(f"DataForSEO check failed: {exc.reason}")

          if body.get("status_code") != 20000:
              fail(f"DataForSEO check failed: {body.get('status_code')} {body.get('status_message')}")
          result = (body.get("tasks") or [{}])[0].get("result") or [{}]
          balance = (result[0].get("money") or {}).get("balance")
          print(f"DataForSEO credentials OK (login {decoded.split(':', 1)[0]}, balance ${balance}).")
          with open(os.environ["GITHUB_ENV"], "a") as env_file:
              env_file.write(f"DATAFORSEO_KEY_NORMALIZED={key}\n")

      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - name: Write .env.selfhost
        env:
          ACCESS_ALLOWED_EMAILS: ${{ secrets.ACCESS_ALLOWED_EMAILS }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: |
          {
            printf 'DATAFORSEO_API_KEY=%s\n' "$DATAFORSEO_KEY_NORMALIZED"
            printf 'ACCESS_ALLOWED_EMAILS=%s\n' "$(printf '%s' "$ACCESS_ALLOWED_EMAILS" | tr -d '[:space:]')"
            [ -z "$OPENROUTER_API_KEY" ] || printf 'OPENROUTER_API_KEY=%s\n' "$OPENROUTER_API_KEY"
          } > .env.selfhost

      # Alchemy keeps deploy state in a state-store Worker on the account.
      # Idempotent: an existing store is adopted, not redeployed.
      - name: Bootstrap the alchemy state store
        run: pnpm alchemy cloudflare bootstrap --env-file .env.selfhost

      - name: Deploy
        run: pnpm deploy:selfhost --yes 2>&1 | tee "$RUNNER_TEMP/deploy.log"

      - name: Show URL
        run: |
          url=$(grep -oE 'https://open-seo-selfhost\.[a-z0-9-]+\.workers\.dev' "$RUNNER_TEMP/deploy.log" | tail -1)
          if [ -z "$url" ]; then
            echo "::warning::Deploy finished but the Worker URL was not found in its output; see Workers & Pages in Cloudflare."
            exit 0
          fi
          echo "BraiSEO: $url" | tee -a "$GITHUB_STEP_SUMMARY"
          # BraiSEO must never be public: expect a Cloudflare Access login redirect.
          for attempt in 1 2 3 4 5 6 7 8; do
            location=$(curl -sS -o /dev/null -m 10 -w '%{redirect_url}' "$url" || true)
            case "$location" in
              https://*.cloudflareaccess.com/*) echo "Cloudflare Access protection verified."; exit 0 ;;
            esac
            sleep 5
          done
          echo "::error::$url did not redirect to a Cloudflare Access login. Check Zero Trust → Access → Applications before sharing the URL."
          exit 1
